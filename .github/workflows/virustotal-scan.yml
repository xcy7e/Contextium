name: VirusTotal APK Scan

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual trigger via actions ui

permissions:
  contents: write

env:
  VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

jobs:
  virustotal-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          # Fallback: falls kein Asset existiert, ersten .apk-Namen nehmen
          ASSET_NAME=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name' 2>/dev/null || echo "")
          if [ -z "$ASSET_NAME" ]; then
            echo "No assets found for release $RELEASE_TAG"
            exit 1
          fi
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir ./downloaded-apk

      - name: Find APK file
        id: find-apk
        run: |
          echo "=== Files in ./downloaded-apk ==="
          find ./downloaded-apk -type f
          APK_PATH=$(find ./downloaded-apk -type f -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in release assets"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "=== Using APK: $APK_PATH ==="

      - name: Scan APK with VirusTotal
        run: |
          echo "APK_PATH from workflow: $APK_PATH"
          export APK_PATH="${{ steps.find-apk.outputs.apk_path }}"
          python -m pip install requests
          python vt_scan.py
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_COMMENT: "Release ${{ github.event.release.tag_name }} – ${{ github.event.release.name }}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit badge JSON to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .github/vt-badge.json
          # Only commit if content changed
          git diff --cached --quiet && echo "No changes to commit" && exit 0 || true
          git commit -m "Update VirusTotal badge for ${{ github.event.release.tag_name }}"
          git push
        env:
          GITHUB_TOKEN: ${{ github.token }}