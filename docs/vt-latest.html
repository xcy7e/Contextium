<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Redirecting to latest VirusTotal report…</title>
    <script>
        fetch('https://raw.githubusercontent.com/xcy7e/Contextium/refs/heads/master/vt-badge.json')
          .then(r => r.json())
          .then(data => {
            if (data && data.url) {
              window.location.replace(data.url);
            } else {
              document.body.textContent = 'No VirusTotal URL found.';
            }
          })
          .catch(() => {
            document.body.textContent = 'Failed to load VirusTotal badge data.';
          });
    </script>
    <style>
        html, body {
            background: #161625;
            margin: 0;
            padding: 0;
            color: #ffffff;
        }
        p {
            margin: 0 auto;
            padding: 33vh 0;
            text-align: center;
            font-size: 12pt;
            font-family: sans-serif, verdana, arial, helvetica;
        }
    </style>
</head>
<body>
<p>Redirecting to latest VirusTotal report…</p>
</body>
</html>
